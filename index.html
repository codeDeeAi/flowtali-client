<html lang="en">

    <link rel="canonical" href="https://flowtali.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flowtali" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Flowtali — Invoices, Receipts, Projects & Letterheads" />
    <meta name="twitter:description" content="The complete document platform for freelancers: invoices, payment receipts, project tracking, and branded letterheads — all in one place." />
    <meta name="twitter:image" content="https://flowtali.com/og-image.png" />
